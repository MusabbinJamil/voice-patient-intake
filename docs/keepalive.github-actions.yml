# OPTIONAL keep-warm workflow (kept here as documentation).
#
# To ACTIVATE it as a real GitHub Action:
#   1. Give your gh token the workflow scope once:
#        gh auth refresh -h github.com -s workflow
#   2. Move this file to .github/workflows/keepalive.yml and push.
#   3. Add a repo variable HEALTH_URL (Settings > Secrets and variables >
#      Actions > Variables) = https://YOUR_APP.onrender.com/health
#
# Simpler alternative (no workflow scope, more reliable cadence): create a free
# monitor at https://cron-job.org pointed at the same /health URL every 10 min.
#
# It pings /health every 10 minutes so Render's free service never cold-starts
# before a reviewer calls.
name: keep-warm
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          URL="${{ vars.HEALTH_URL }}"
          if [ -z "$URL" ]; then echo "HEALTH_URL variable not set"; exit 0; fi
          echo "Pinging $URL"
          curl -fsS --max-time 60 "$URL" || echo "ping failed (service may be waking)"
